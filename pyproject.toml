[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-contextfetch"
version = "0.1.1"
description = "An integration package connecting ContextFetch and LangChain"
authors = [{ name = "ContextFetch" }]
license = "MIT"
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "contextfetch>=0.1.0,<1.0.0",
]

[project.urls]
Homepage = "https://contextfetch.dev"
Documentation = "https://contextfetch.dev/docs/reference"
"Source Code" = "https://github.com/lachy3433/langchain-contextfetch"
Repository = "https://github.com/lachy3433/langchain-contextfetch"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "langchain-tests==1.1.9",
]
test_integration = []
lint = ["ruff>=0.13.1,<0.14.0"]
typing = ["mypy>=1.10,<3.0"]

[tool.hatch.build.targets.sdist]
only-include = ["langchain_contextfetch", "tests", "README.md", "LICENSE"]

[tool.mypy]
disallow_untyped_defs = true

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"
